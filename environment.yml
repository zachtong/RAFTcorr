# conda env create -f environment.yml
# Then install the PyTorch build that matches your GPU (see install.bat / README), e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
# and finally:  pip install -e .
name: raftcorr-app
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pillow>=9.0
  - tifffile>=2023.1
  - matplotlib>=3.7
  - h5py>=3.8
  - pip:
      - PySide6>=6.6
      - imageio>=2.28
      - imageio-ffmpeg>=0.4
      - pytest>=7.0
      - pytest-qt>=4.2
