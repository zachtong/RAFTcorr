[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raftcorr"
dynamic = ["version"]
description = "RAFTcorr: learned digital image correlation (desktop application, command line and Python library)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zixiang (Zach) Tong" }]
license = { file = "LICENSE.md" }
keywords = [
    "digital-image-correlation",
    "DIC",
    "experimental-mechanics",
    "strain-measurement",
    "deep-learning",
    "optical-flow",
    "RAFT",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "License :: Other/Proprietary License",
    "Environment :: X11 Applications :: Qt",
]

# One `pip install raftcorr` brings the whole application, as pyALDIC's does. torch is not pinned
# to a CUDA build: for an NVIDIA GPU install the matching wheel from the PyTorch index first
# (README; the Windows installer and install.bat do it for you).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=9.0",
    "tifffile>=2023.1",
    "matplotlib>=3.7",
    "torch>=2.1",
    "PySide6>=6.6",
    "h5py>=3.8",
    "imageio>=2.28",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.2", "pytest-cov>=4.0"]
# Kept so that older instructions (`pip install raftcorr[all]`) still work.
all = []

[project.urls]
Homepage = "https://github.com/zachtong/RAFTcorr"
Repository = "https://github.com/zachtong/RAFTcorr"
Issues = "https://github.com/zachtong/RAFTcorr/issues"
Releases = "https://github.com/zachtong/RAFTcorr/releases"

[project.scripts]
raftcorr = "raftcorr.cli.main:main"

[project.gui-scripts]
raftcorr-gui = "raftcorr.gui.app:main"

[tool.hatch.version]
path = "src/raftcorr/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/raftcorr"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/LICENSE.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --tb=short"
markers = [
    "gpu: needs a CUDA device",
    "weights: needs the released model weights",
    "research: needs the research repository (parity with the paper implementation)",
    "gui: needs PySide6 (runs offscreen)",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning:pyparsing.*"]

[tool.coverage.run]
source = ["raftcorr"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
