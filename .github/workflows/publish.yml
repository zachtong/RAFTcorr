name: Publish to PyPI

# Publishes when a version tag is pushed, with PyPI Trusted Publishing (OpenID Connect): no API
# token to paste, store or rotate.
#
# One-time setup on PyPI (Account -> Publishing -> add a pending publisher):
#   PyPI project name  raftcorr
#   Owner              zachtong
#   Repository         RAFTcorr
#   Workflow           publish.yml
#   Environment        pypi
#
# Release:  git tag -a v2.0.0 -m "..." && git push origin v2.0.0
#   -> builds, checks and publishes, attaches the wheel and sdist to the tag's release, then
#      installs that version from PyPI on Linux, Windows and macOS and starts it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # re-run, e.g. after a failed publish

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Package version
        id: version
        run: |
          PKG=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('src/raftcorr/_version.py').read_text()).group(1))")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG: ${{ steps.version.outputs.version }}
        run: |
          echo "tag=${GITHUB_REF_NAME#v}  package=$PKG"
          [ "${GITHUB_REF_NAME#v}" = "$PKG" ] || { echo "::error::Tag does not match the package version $PKG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # re-running after a partial publish is safe

  attach:
    name: Attach the distributions to the GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to the release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    # What a user gets: `pip install raftcorr==<version>` from PyPI itself, no checkout, then the
    # command starts and opens the main window offscreen. PyPI never takes a version twice, so this
    # cannot stop a bad upload, but it says so the day it happens.
    name: pip install from PyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"     # the oldest requires-python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: PyTorch, CPU build
        if: runner.os != 'macOS'   # on macOS the build on PyPI is the one to use
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: pip install raftcorr==${{ needs.build.outputs.version }}
        run: |
          # A new upload can take a few minutes to reach every mirror of the index.
          for i in 1 2 3 4 5 6; do
            python -m pip install --no-cache-dir "raftcorr==$VERSION" && exit 0
            echo "not installable yet (attempt $i), retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Start it
        run: |
          cd "$RUNNER_TEMP"
          raftcorr --version | tee version.txt
          grep -qF "raftcorr $VERSION" version.txt
          raftcorr selftest --gui --no-models
