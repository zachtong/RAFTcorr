name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests without GPU, weights or research code
        run: pytest -m "not gpu and not weights and not research" -q

  package:
    # The wheel a user gets from PyPI: builds, passes `twine check`, installs into a clean virtual
    # environment and starts (the GUI offscreen), so a missing data file never reaches a release.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment and start it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          source "$RUNNER_TEMP/clean/bin/activate"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          raftcorr --version
          raftcorr selftest --gui --no-models
